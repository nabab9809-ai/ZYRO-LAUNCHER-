name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      # - name: Get JRE17
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-new
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre17-pojav
      #
      # - name: Get JRE21
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-21
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre21-pojav
      #
      # - name: Get JRE25
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-25
      #     workflow_conclusion: completed
      #     repo: FCL-Team/Android-OpenJDK-Build
      #     branch: Build_JRE_25
      #     name: jre25-multiarch

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      # Build and stage the actual Horizon runtime into ZYRO before Gradle packages the APK.
      - name: Install Rust Android target and Horizon NDK
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.95.0
          rustup default 1.95.0
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          rustc --version
          cargo --version

      - name: Cache Horizon Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            third_party/horizon/target
          key: zyro-horizon-android-arm64-${{ runner.os }}-${{ hashFiles('third_party/horizon/Cargo.lock', 'third_party/horizon/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            zyro-horizon-android-arm64-${{ runner.os }}-${{ hashFiles('third_party/horizon/Cargo.lock', 'third_party/horizon/rust-toolchain.toml') }}-

      - name: Set up Python 3.11 for Horizon preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare public Horizon engine data
        working-directory: third_party/horizon
        run: |
          python3 tools/android_prepare.py

      - name: Compile and package Horizon into ZYRO
        working-directory: third_party/horizon
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/third_party/horizon/target
          CARGO_BUILD_JOBS: '2'
        run: |
          python3 tools/android_build.py --abi arm64-v8a --rust-only --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --ndk-version 28.2.13676358 \
            --build-tools-version 35.0.0
          mkdir -p ../app_pojavlauncher/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libhorizon_android.so \
            ../app_pojavlauncher/src/main/jniLibs/arm64-v8a/libhorizon_android.so
          cd ..
          python3 -c 'import runpy, shutil; f=runpy.run_path("third_party/horizon/tools/android_build.py"); shutil.copyfile(f["engine_data"](True), "app_pojavlauncher/src/main/assets/engine-data.zip")'
          test -s app_pojavlauncher/src/main/jniLibs/arm64-v8a/libhorizon_android.so
          test -s app_pojavlauncher/src/main/assets/engine-data.zip
          sha256sum app_pojavlauncher/src/main/jniLibs/arm64-v8a/libhorizon_android.so app_pojavlauncher/src/main/assets/engine-data.zip

      - name: Build Debug .apk
        run: |
          # Build the installable test launcher first; it uses the project's debug key.
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Verify Horizon runtime inside debug APK
        run: |
          unzip -Z1 out/app-debug.apk | grep -Fx 'lib/arm64-v8a/libhorizon_android.so'
          unzip -Z1 out/app-debug.apk | grep -Fx 'assets/engine-data.zip'
          unzip -p out/app-debug.apk assets/engine-data.zip > out/engine-data-check.zip
          unzip -t out/engine-data-check.zip
          unzip -p out/app-debug.apk lib/arm64-v8a/libhorizon_android.so > out/horizon-check.so
          readelf -h out/horizon-check.so | grep -F 'Machine:                           AArch64'
          rm out/engine-data-check.zip out/horizon-check.so

      - name: Gen debug md5sum
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*

      - name: Build Release .apk
        continue-on-error: true
        run: |
          # Release signing depends on the private upload keystore credentials.
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/app-release.apk

      - name: Gen release md5sum
        if: hashFiles('out/app-release.apk') != ''
        run: |
          md5sum out/app-release.apk > out/app-release.md5

      - name: Upload release APK
        if: hashFiles('out/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release.*